<script>
/*KONTROL-BAS*/
/* Çıktı denetimi. Metni serbest bırakır, yalnız satır sırasına ve sonuçlara bakar. */
var Denetim=(function(){
'use strict';
function sayilar(s){return (String(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);}
function kisalt(s){s=s.trim();return s.length>48?s.slice(0,45)+'…':s;}
/* başlık, ayraç ve kapanış satırlarını ayıklayan adaylar; ilki en ham hâli */
function adaylar(cikti){
 var L=cikti.split('\n').filter(function(l){return /\d/.test(l);});
 var baslik=function(l){return /[A-Za-zÇĞİÖŞÜçğıöşü]{3,}/.test(l)&&!/\d\W*$/.test(l);};
 return [L,L.filter(function(l){return !baslik(l);}),L.filter(function(l){return sayilar(l).length>=2;}),L.filter(function(l){return sayilar(l).length>=3;})];
}
/* sonuç satırın sonunda (7 x 3 = 21) ya da başında (21 = 7 x 3) olabilir; bütün satırlarda aynı yerde */
function son(l,x){var n=sayilar(l);return n[n.length-1]===x;}
function ilk(l,x){return sayilar(l)[0]===x;}
function esles(cikti,bek){return adaylar(cikti).some(function(a){return a.length===bek.length&&[son,ilk].some(function(u){return a.every(function(l,i){return u(l,bek[i]);});});});}
function ilkFark(cikti,bek){
 var A=adaylar(cikti),a=A[3].length?A[3]:A[1].length?A[1]:A[0],i=0;
 function kac(u){var k=0;while(k<a.length&&k<bek.length&&u(a[k],bek[k]))k++;return k;}
 i=kac(son);if(i===0&&kac(ilk)>2)i=kac(ilk);
 return {n:a.length,i:i,satir:a[i]};
}
function tabloA(n){var b=[];for(var i=1;i<=10;i++)b.push(n*i);return b;}
function tabloB(){var b=[];for(var i=1;i<=10;i++)b=b.concat(tabloA(i));return b;}
/* 10 x 10 düzeninde yan yana yazılmış tablo */
function izgara(cikti){
 var L=cikti.split('\n').map(sayilar).filter(function(n){return n.length>=10;});
 function tam(R){return R.length===10&&R.every(function(n,i){var b=tabloA(i+1);if(n.length===11&&n[0]===i+1)n=n.slice(1);return n.length===10&&n.every(function(x,j){return x===b[j];});});}
 return tam(L)||tam(L.slice(1));
}
var DUZ='Sonuçlar doğru, ama satırlar tek tek yazılmış. Bu işi bir döngüye yaptır.';
function elle(Y){return !Y||Y.dongu<1||Y.yaz>=10||Y.uzun;}
/* r: {cikti, hata, soru}  ;  null = geçti, metin = geri bildirim */
function a(kos,Y,sayi){
 var r=kos,bek=tabloA(sayi),g='Program `'+sayi+'` girilerek denendi. ';
 if(r.soru===0&&!r.hata)return 'Program kullanıcıdan sayı almadı.';
 if(r.hata)return (/(Syntax|Indentation|Tab)Error/.test(r.hata)?'':g)+r.hata;
 if(!r.cikti.trim())return g+'Ekrana bir şey yazmadı.';
 if(!esles(r.cikti,bek)){
  var f=ilkFark(r.cikti,bek);
  if(f.n===0)return g+'Ekranda çarpım tablosu görünmedi.';
  if(f.i<bek.length&&f.satir!=null)return g+(f.i+1)+'. satırın sonucu `'+bek[f.i]+'` olmalıydı, programın `'+kisalt(f.satir)+'` yazdı.';
  return g+'Tablo 1\'den 10\'a kadar, '+bek.length+' satır olmalı; programın '+f.n+' satır yazdı.';
 }
 return null;
}
function b(r,Y){
 var bek=tabloB();
 if(r.soru>0)return 'Program kullanıcıdan sayı istedi. Bu görevde hangi sayıların tablosunun yazılacağı baştan belli.';
 if(r.hata)return r.hata;
 if(!r.cikti.trim())return 'Program ekrana bir şey yazmadı.';
 if(!esles(r.cikti,bek)&&!izgara(r.cikti)){
  var f=ilkFark(r.cikti,bek),k=f.i,x=Math.floor(k/10)+1,y=k%10+1;
  if(f.n===0)return 'Ekranda çarpım tablosu görünmedi.';
  if(k<bek.length&&f.satir!=null)return 'Sırada `'+x+' x '+y+' = '+x*y+'` satırı olmalıydı, programın `'+kisalt(f.satir)+'` yazdı.';
  if(k<bek.length)return 'Tablo `'+(y===1?(x-1)+' x 10':x+' x '+(y-1))+'` satırından sonra bitti. 10\'un tablosuna kadar gitmeli.';
  return 'Tablo `10 x 10` satırından sonra da devam ediyor.';
 }
 return null;
}
return {a:a,b:b,elle:elle,DUZ:DUZ};
})();

(function(){

{id:'a',ad:'Tek başına',metin:'Kullanıcıdan bir sayı alan ve o sayının 1\'den 10\'a kadar olan çarpım tablosunu yazdıran programı sıfırdan yaz.',

/* ------------------------------------------------------------ Python */
var py=null,pyDurum='yukleniyor',mesgul=false,hedef=null,kutuVar=typeof WebAssembly!=='undefined'&&typeof WebAssembly.Suspending==='function';

'import builtins, sys, json, js, ast',

'    return c',
'builtins.input = _input',
'class _Cikis:',
'    encoding = "utf-8"',
'    def write(self, m):',
'        m = str(m)',
'        _d["yazi"] += len(m)',
'        if _d["yazi"] > 20000:',
'            raise DonguDurmuyor("Program çok fazla satır yazdı, durduruldu. Döngü bitmiyor olabilir.")',
'        js.kkYaz(m)',
'        return len(m)',
'    def flush(self): pass',
'    def isatty(self): return False',
'def _yapi(kaynak):',
'    y = {"dongu": 0, "yaz": 0, "uzun": False}',
'    for d in ast.walk(ast.parse(kaynak)):',
'        if isinstance(d, (ast.For, ast.While, ast.comprehension)): y["dongu"] += 1',
'        if isinstance(d, ast.Call) and isinstance(d.func, ast.Name) and d.func.id in ("map",): y["dongu"] += 1',
'        if isinstance(d, ast.Call) and isinstance(d.func, ast.Name) and d.func.id == "print": y["yaz"] += 1',
'        if isinstance(d, ast.Constant) and isinstance(d.value, str) and sum(c.isdigit() for c in d.value) > 25: y["uzun"] = True',

].join('\n');
window.kkYaz=function(m,gir){if(hedef)hedef.yaz(String(m),gir);};
window.kkPencere=function(s){var c=window.prompt(s||'');return c===null?'':c;};
window.kkGirdi=function(){return new Promise(function(coz){
 var k=hedef&&hedef.kutu;if(!k){coz('');return;}
 var g=el('input');g.type='text';g.autocomplete='off';g.setAttribute('aria-label','Girdi');k.appendChild(g);k.scrollTop=k.scrollHeight;g.focus();
 hedef.birak=function(){g.remove();coz('');};
 g.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var c=g.value,s=el('span','gir');s.textContent=c+'\n';g.replaceWith(s);coz(c);}});});};

function hataMetni(e){
 var m=String(e&&e.message||e).trim().split('\n'),son=m[m.length-1]||'',satir=null;
 for(var i=m.length-1;i>=0;i--){var x=/File "<kod>", line (\d+)/.exec(m[i]);if(x){satir=x[1];break;}}
 if(/run_sync|stack switching|JSPI/i.test(son)){kutuVar=false;return 'Bu tarayıcıda sayfa içi kutu çalışmadı. Yeniden çalıştır; sorular açılır pencereyle gelecek.';}

async function kos(src,mod,girdiler,alici){
 hedef=alici;var hata=null;
 py.globals.set('_k',src);py.globals.set('_m',mod);py.globals.set('_g',JSON.stringify(girdiler||[]));
 try{await py.runPythonAsync('_calistir(_k, _m, _g)');}catch(e){hata=hataMetni(e);}
 hedef=null;return hata;

 var c='',h=await kos(src,'test',girdiler,{yaz:function(m){if(c.length<60000)c+=m;}});
